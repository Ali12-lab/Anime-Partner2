name: Build Anime Partner APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: [index.html, logo-foreground-512.png, logo-background-512.png, .github/workflows/build.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check signing key secret
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Missing repository secret KEYSTORE_B64. Add it in Settings > Secrets and variables > Actions."; exit 1; fi

      - name: Create the Android project (Capacitor)
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/share@6 @capacitor/local-notifications@6
          mkdir -p www
          cp index.html www/index.html
          sed -i "s#__REPO__#${{ github.repository }}#g; s#__BUILD__#${{ github.run_number }}#g" www/index.html
          npx cap init "Anime Partner" com.shin.animepartner --web-dir www
          npx cap add android
          npx cap sync android

      - name: Allow notifications (Android 13+)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$M"

      - name: Apply Anime Partner icon and splash screen
        run: |
          pip install pillow
          python3 - <<'PYEOF'
          import os, glob
          from PIL import Image, ImageDraw
          res = 'android/app/src/main/res'
          fg = Image.open('logo-foreground-512.png').convert('RGBA')
          bg = Image.open('logo-background-512.png').convert('RGBA')
          full = Image.alpha_composite(bg, fg)
          dens = {'mdpi':1,'hdpi':1.5,'xhdpi':2,'xxhdpi':3,'xxxhdpi':4}
          def mask(size, shape):
              m = Image.new('L',(size*4,size*4),0); d = ImageDraw.Draw(m)
              if shape == 'round': d.ellipse([0,0,size*4-1,size*4-1], fill=255)
              else: d.rounded_rectangle([0,0,size*4-1,size*4-1], radius=int(size*4*0.22), fill=255)
              return m.resize((size,size), Image.LANCZOS)
          for name, s in dens.items():
              d = f'{res}/mipmap-{name}'; os.makedirs(d, exist_ok=True)
              a = int(108*s); l = int(48*s)
              fg.resize((a,a), Image.LANCZOS).save(f'{d}/ic_launcher_foreground.png')
              bg.resize((a,a), Image.LANCZOS).save(f'{d}/ic_launcher_bg.png')
              icon = full.resize((l,l), Image.LANCZOS)
              for fn, shape in (('ic_launcher','square'),('ic_launcher_round','round')):
                  out = Image.new('RGBA',(l,l),(0,0,0,0)); out.paste(icon,(0,0),mask(l,shape)); out.save(f'{d}/{fn}.png')
          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          adaptive = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@mipmap/ic_launcher_bg"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for fn in ('ic_launcher.xml','ic_launcher_round.xml'):
              open(f'{res}/mipmap-anydpi-v26/{fn}','w').write(adaptive)
          for f in glob.glob(res + '/drawable*/splash.png'): os.remove(f)
          os.makedirs(f'{res}/drawable-nodpi', exist_ok=True)
          fg.resize((384,384), Image.LANCZOS).save(f'{res}/drawable-nodpi/splash_logo.png')
          os.makedirs(f'{res}/values', exist_ok=True)
          open(f'{res}/values/ap_colors.xml','w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ap_brand">#B253AE</color>\n</resources>\n')
          os.makedirs(f'{res}/drawable', exist_ok=True)
          open(f'{res}/drawable/splash.xml','w').write('<?xml version="1.0" encoding="utf-8"?>\n<layer-list xmlns:android="http://schemas.android.com/apk/res/android">\n    <item android:drawable="@color/ap_brand"/>\n    <item>\n        <bitmap android:gravity="center" android:src="@drawable/splash_logo"/>\n    </item>\n</layer-list>\n')
          print('assets generated')
          PYEOF

      - name: Set version number
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > ap.jks
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks ap.jks --ks-pass pass:MiDwgNC1VgHEv6QJCvVO --key-pass pass:MiDwgNC1VgHEv6QJCvVO --out AnimePartner.apk aligned.apk
          "$BT/apksigner" verify AnimePartner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AnimePartner-apk
          path: AnimePartner.apk

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" AnimePartner.apk --title "Anime Partner build ${{ github.run_number }}" --notes "Download AnimePartner.apk on your Android phone and install it over the old version." --latest
